<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="596" viewBox="0 0 1180 596" role="img" aria-label="How to choose the Starlight library for Main, Tele, Wide and Front lenses"><rect width="1180" height="596" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1178" height="594" rx="23" fill="none" stroke="#2a1f45"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070510"/>
      <stop offset=".55" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f0abfc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="video" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloMint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c8aa5"/>
    </marker>

    <style><![CDATA[
      .rise   { animation: rise 3.4s ease-in-out infinite; }
      @keyframes rise   { 0%,100% { opacity:.62 } 50% { opacity:1 } }
      .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}
      .d4{animation-delay:1.2s}.d5{animation-delay:1.5s}.d6{animation-delay:1.8s}
      .d7{animation-delay:2.1s}.d8{animation-delay:2.4s}

      .dash   { stroke-dasharray:6 8; animation: dash 1.7s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-28 } }

      .tick   { stroke-dasharray:56; stroke-dashoffset:56;
                animation: tick 3.6s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes tick { 0%{stroke-dashoffset:56} 40%,74%{stroke-dashoffset:0}
                        100%{stroke-dashoffset:56} }
      .k1{animation-delay:.35s}.k2{animation-delay:.7s}.k3{animation-delay:1.05s}
      .k4{animation-delay:1.4s}.k5{animation-delay:1.75s}.k6{animation-delay:2.1s}

      .glow  { animation: glow 4s ease-in-out infinite; }
      @keyframes glow { 0%,100%{opacity:.26} 50%{opacity:.92} }

      .sweep { animation: sweep 5.2s cubic-bezier(.4,0,.6,1) infinite; }
      @keyframes sweep { 0%{transform:translateX(-200px)} 100%{transform:translateX(1300px)} }

      .drift { animation: drift 17s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(38px,-22px)} }

      .lift  { animation: lift 5.4s ease-in-out infinite; }
      @keyframes lift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

      .spin  { animation: spin 30s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .ring  { animation: ring 4.4s ease-in-out infinite; }
      @keyframes ring { 0%,100%{opacity:.32;transform:scale(1)}
                        50%{opacity:.8;transform:scale(1.06)} }

      .tw    { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.14} 50%{opacity:.92} }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }]]></style>
  </defs>
  <g filter="url(#soft)">
    <circle class="drift" cx="200" cy="200" r="130" fill="url(#halo)"/>
    <circle class="drift d3" cx="1020" cy="480" r="120" fill="url(#haloMint)"/>
  </g>

  <g transform="translate(40 36)">
    <circle class="ring" cx="30" cy="30" r="30" fill="#a78bfa" opacity=".16"/>
    <circle cx="30" cy="30" r="21" fill="none" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="30" cy="30" r="8" fill="#a78bfa" opacity=".85"/>
  </g>
  <text x="124" y="62" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#f8fafc">Set the library for every lens</text>
  <text x="124" y="90" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a78bfa">One file, four slots. About a minute.</text>
  <text x="124" y="114" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Skip it and the camera still works — it just uses the default processing.</text>

  <rect x="830" y="88" width="310" height="3" rx="1.5" fill="#2a1f45"/><rect class="sweep" x="830" y="87" width="150" height="5" rx="2.5" fill="url(#rail)"/>

  <text x="40" y="168" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#f0abfc" letter-spacing="1.4">Get there</text>
  
    <g class="rise d1">
      <rect x="40" y="186" width="264" height="52" rx="13" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="70" cy="212" r="14" fill="#f0abfc" opacity=".18"/><text x="70" y="216.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f0abfc">1</text>
      <text x="92" y="217" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Open Starlight Camera</text>
      <path class="dash d1" d="M308 212 H322" stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    </g>
    <g class="rise d2">
      <rect x="328" y="186" width="264" height="52" rx="13" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="358" cy="212" r="14" fill="#f0abfc" opacity=".18"/><text x="358" y="216.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f0abfc">2</text>
      <text x="380" y="217" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Settings</text>
      <path class="dash d2" d="M596 212 H610" stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    </g>
    <g class="rise d3">
      <rect x="616" y="186" width="264" height="52" rx="13" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="646" cy="212" r="14" fill="#f0abfc" opacity=".18"/><text x="646" y="216.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f0abfc">3</text>
      <text x="668" y="217" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Photo processing</text>
      <path class="dash d3" d="M884 212 H898" stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    </g>
    <g class="rise d4">
      <rect x="904" y="186" width="264" height="52" rx="13" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="934" cy="212" r="14" fill="#f0abfc" opacity=".18"/><text x="934" y="216.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f0abfc">4</text>
      <text x="956" y="217" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Library</text>
      
    </g>

  <text x="40" y="244" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#34d399" letter-spacing="1.4">Then pick the file in each row</text>
  
    <g class="rise d2">
      <rect x="40" y="256" width="636" height="60" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="256" width="4" height="60" rx="2" fill="#a78bfa"/>
      <circle class="ring" cx="84" cy="286" r="15" fill="#a78bfa" opacity=".16"/>
      <circle cx="84" cy="286" r="6.5" fill="#a78bfa"/>
      <text x="116" y="282" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Main camera</text>
      <text x="116" y="302" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">108 MP S5KHM2</text>
      <rect x="606" y="276" width="0" height="0"/>
      <text x="558" y="283" text-anchor="end" font-family=""
            font-size="12" font-weight="700" fill="#a78bfa">libs_key</text>
      <path class="tick k1" transform="translate(642 286) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#a78bfa" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d3">
      <rect x="40" y="326" width="636" height="60" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="326" width="4" height="60" rx="2" fill="#60a5fa"/>
      <circle class="ring" cx="84" cy="356" r="15" fill="#60a5fa" opacity=".16"/>
      <circle cx="84" cy="356" r="6.5" fill="#60a5fa"/>
      <text x="116" y="352" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Tele camera</text>
      <text x="116" y="372" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">2× zoom</text>
      <rect x="606" y="346" width="0" height="0"/>
      <text x="558" y="353" text-anchor="end" font-family=""
            font-size="12" font-weight="700" fill="#a78bfa">libs_key_2</text>
      <path class="tick k2" transform="translate(642 356) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#60a5fa" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d4">
      <rect x="40" y="396" width="636" height="60" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="396" width="4" height="60" rx="2" fill="#22d3ee"/>
      <circle class="ring" cx="84" cy="426" r="15" fill="#22d3ee" opacity=".16"/>
      <circle cx="84" cy="426" r="6.5" fill="#22d3ee"/>
      <text x="116" y="422" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Wide angle</text>
      <text x="116" y="442" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">IMX355 ultra-wide</text>
      <rect x="606" y="416" width="0" height="0"/>
      <text x="558" y="423" text-anchor="end" font-family=""
            font-size="12" font-weight="700" fill="#a78bfa">libs_key_3</text>
      <path class="tick k3" transform="translate(642 426) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#22d3ee" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d5">
      <rect x="40" y="466" width="636" height="60" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="466" width="4" height="60" rx="2" fill="#f0abfc"/>
      <circle class="ring" cx="84" cy="496" r="15" fill="#f0abfc" opacity=".16"/>
      <circle cx="84" cy="496" r="6.5" fill="#f0abfc"/>
      <text x="116" y="492" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Front camera</text>
      <text x="116" y="512" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">IMX471 selfie</text>
      <rect x="606" y="486" width="0" height="0"/>
      <text x="558" y="493" text-anchor="end" font-family=""
            font-size="12" font-weight="700" fill="#a78bfa">libs_key_front</text>
      <path class="tick k4" transform="translate(642 496) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#f0abfc" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  <path class="dash d2" d="M682 286 H718" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/><path class="dash d3" d="M682 356 H718" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/><path class="dash d4" d="M682 426 H718" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/><path class="dash d5" d="M682 496 H718" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/>
  
    <g class="lift">
      <rect x="756" y="256" width="384" height="280" rx="13" fill="#0c1a17" stroke="#2f6b56"/><rect x="756" y="256" width="4" height="280" rx="2" fill="#34d399"/>
      <text x="786" y="292" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#34d399">Pick this file</text>
      <rect x="786" y="310" width="322" height="46" rx="11" fill="#0a1712" stroke="#2f6b56"/>
      <text x="802" y="339" font-family="" font-size="13"
            font-weight="700" fill="#a7f3d0">Starlight_EOS_R10_DSLR.so</text>
      <text x="786" y="384" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">It is already in place if you copied it</text>
      <text x="786" y="403" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">into /sdcard/LMC8.4/libs/</text>
      <line x1="786" y1="424" x2="1110" y2="424" stroke="#2f6b56" opacity=".5"/>
      <text x="786" y="452" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Do the same for every lens you shoot with.</text>
      <text x="786" y="471" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Leave a lens on Default to keep the</text>
      <text x="786" y="490" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">stock processing for it.</text>
      <text x="786" y="518" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">Restart the camera afterwards.</text>
    </g>

  <rect x="40" y="534" width="1100" height="42" rx="13" fill="#160f27" stroke="#2a1f45"/>
  <text x="62" y="560" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Optional. This swaps in the Starlight-tuned processing recipe; the camera works without it.</text>
  </svg>