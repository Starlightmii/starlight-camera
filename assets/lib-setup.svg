<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="How to choose the Starlight library for Main, Tele, Wide and Front lenses"><rect width="880" height="500" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="878" height="498" rx="23" fill="none" stroke="#2a1f45"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070510"/>
      <stop offset=".55" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f0abfc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="video" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloMint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c8aa5"/>
    </marker>

    <style><![CDATA[
      .rise   { animation: rise 3.4s ease-in-out infinite; }
      @keyframes rise   { 0%,100% { opacity:.62 } 50% { opacity:1 } }
      .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}
      .d4{animation-delay:1.2s}.d5{animation-delay:1.5s}.d6{animation-delay:1.8s}
      .d7{animation-delay:2.1s}.d8{animation-delay:2.4s}

      .dash   { stroke-dasharray:6 8; animation: dash 1.7s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-28 } }

      .tick   { stroke-dasharray:56; stroke-dashoffset:56;
                animation: tick 3.6s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes tick { 0%{stroke-dashoffset:56} 40%,74%{stroke-dashoffset:0}
                        100%{stroke-dashoffset:56} }
      .k1{animation-delay:.35s}.k2{animation-delay:.7s}.k3{animation-delay:1.05s}
      .k4{animation-delay:1.4s}.k5{animation-delay:1.75s}.k6{animation-delay:2.1s}

      .glow  { animation: glow 4s ease-in-out infinite; }
      @keyframes glow { 0%,100%{opacity:.26} 50%{opacity:.92} }

      .sweep { animation: sweep 5.2s cubic-bezier(.4,0,.6,1) infinite; }
      @keyframes sweep { 0%{transform:translateX(-200px)} 100%{transform:translateX(1300px)} }

      .drift { animation: drift 17s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(38px,-22px)} }

      .lift  { animation: lift 5.4s ease-in-out infinite; }
      @keyframes lift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

      .spin  { animation: spin 30s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .ring  { animation: ring 4.4s ease-in-out infinite; }
      @keyframes ring { 0%,100%{opacity:.32;transform:scale(1)}
                        50%{opacity:.8;transform:scale(1.06)} }

      .tw    { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.14} 50%{opacity:.92} }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }]]></style>
  </defs>
  <g filter="url(#soft)">
    <circle class="drift" cx="150" cy="180" r="110" fill="url(#halo)"/>
    <circle class="drift d4" cx="760" cy="400" r="110" fill="url(#haloMint)"/>
  </g>

  <text x="40" y="52" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#f8fafc">Set the library for every lens</text>
  <text x="40" y="78" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a78bfa">One file, four slots.</text>
  <text x="40" y="102" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Optional — the camera works without it, using default processing.</text>

  <text x="40" y="138" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#f0abfc" letter-spacing="2">THEN</text>
  
    <g class="rise d1">
      <rect x="40" y="150" width="190" height="46" rx="11" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="66" cy="173" r="12.5" fill="#f0abfc" opacity=".18"/><text x="66" y="177.68" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#f0abfc">1</text>
      <text x="86" y="178" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Open the app</text>
      <path class="dash d1" d="M234 173 H242" stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    </g>
    <g class="rise d2">
      <rect x="242" y="150" width="190" height="46" rx="11" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="268" cy="173" r="12.5" fill="#f0abfc" opacity=".18"/><text x="268" y="177.68" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#f0abfc">2</text>
      <text x="288" y="178" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Settings</text>
      <path class="dash d2" d="M436 173 H444" stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    </g>
    <g class="rise d3">
      <rect x="444" y="150" width="190" height="46" rx="11" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="470" cy="173" r="12.5" fill="#f0abfc" opacity=".18"/><text x="470" y="177.68" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#f0abfc">3</text>
      <text x="490" y="178" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Photo processing</text>
      <path class="dash d3" d="M638 173 H646" stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    </g>
    <g class="rise d4">
      <rect x="646" y="150" width="190" height="46" rx="11" fill="#160f27" stroke="#2a1f45"/>
      <circle cx="672" cy="173" r="12.5" fill="#f0abfc" opacity=".18"/><text x="672" y="177.68" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#f0abfc">4</text>
      <text x="692" y="178" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Library</text>
      
    </g>

  <text x="40" y="202" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#34d399" letter-spacing="2">PICK THE FILE IN EACH ROW</text>
  
    <g class="rise d2">
      <rect x="40" y="214" width="424" height="50" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="214" width="4" height="50" rx="2" fill="#a78bfa"/>
      <circle class="ring" cx="74" cy="239" r="13" fill="#a78bfa" opacity=".16"/>
      <circle cx="74" cy="239" r="5.6" fill="#a78bfa"/>
      <text x="100" y="236" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Main camera</text>
      <text x="100" y="254" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">108 MP S5KHM2</text>
      <text x="446" y="243" text-anchor="end" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13" font-weight="700" fill="#a78bfa">libs_key</text>
      <path class="tick k1" transform="translate(430 239) scale(0.8)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#a78bfa" stroke-width="4.00" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d3">
      <rect x="40" y="272" width="424" height="50" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="272" width="4" height="50" rx="2" fill="#60a5fa"/>
      <circle class="ring" cx="74" cy="297" r="13" fill="#60a5fa" opacity=".16"/>
      <circle cx="74" cy="297" r="5.6" fill="#60a5fa"/>
      <text x="100" y="294" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Tele camera</text>
      <text x="100" y="312" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">2× zoom</text>
      <text x="446" y="301" text-anchor="end" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13" font-weight="700" fill="#a78bfa">libs_key_2</text>
      <path class="tick k2" transform="translate(430 297) scale(0.8)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#60a5fa" stroke-width="4.00" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d4">
      <rect x="40" y="330" width="424" height="50" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="330" width="4" height="50" rx="2" fill="#22d3ee"/>
      <circle class="ring" cx="74" cy="355" r="13" fill="#22d3ee" opacity=".16"/>
      <circle cx="74" cy="355" r="5.6" fill="#22d3ee"/>
      <text x="100" y="352" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Wide angle</text>
      <text x="100" y="370" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">IMX355 ultra-wide</text>
      <text x="446" y="359" text-anchor="end" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13" font-weight="700" fill="#a78bfa">libs_key_3</text>
      <path class="tick k3" transform="translate(430 355) scale(0.8)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#22d3ee" stroke-width="4.00" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d5">
      <rect x="40" y="388" width="424" height="50" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="388" width="4" height="50" rx="2" fill="#f0abfc"/>
      <circle class="ring" cx="74" cy="413" r="13" fill="#f0abfc" opacity=".16"/>
      <circle cx="74" cy="413" r="5.6" fill="#f0abfc"/>
      <text x="100" y="410" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">Front camera</text>
      <text x="100" y="428" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">IMX471 selfie</text>
      <text x="446" y="417" text-anchor="end" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13" font-weight="700" fill="#a78bfa">libs_key_front</text>
      <path class="tick k4" transform="translate(430 413) scale(0.8)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#f0abfc" stroke-width="4.00" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  <path class="dash d2" d="M468 239 H486" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/><path class="dash d3" d="M468 297 H486" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/><path class="dash d4" d="M468 355 H486" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/><path class="dash d5" d="M468 413 H486" stroke="#7c8aa5"
               stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <g class="lift">
    <rect x="500" y="214" width="340" height="224" rx="11" fill="#0c1a17" stroke="#2f6b56"/><rect x="500" y="214" width="4" height="224" rx="2" fill="#34d399"/>
    <text x="522" y="246" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#34d399">Pick this file</text>
    <rect x="522" y="262" width="296" height="42" rx="9" fill="#0a1712" stroke="#2f6b56"/>
    <text x="536" y="289" font-family="Inter, 'Segoe UI', sans-serif" font-size="13"
          font-weight="700" fill="#a7f3d0">Starlight_EOS_R10_DSLR.so</text>
    <text x="522" y="330" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Already in /sdcard/LMC8.4/libs/</text>
    <text x="522" y="350" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">if you copied it earlier.</text>
    <line x1="522" y1="368" x2="818" y2="368" stroke="#2f6b56" opacity=".5"/>
    <text x="522" y="394" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Do the same for each lens.</text>
    <text x="522" y="414" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Restart the camera.</text>
  </g>

  <text x="40" y="480" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280">Everything is on-device. Nothing about your photos leaves the phone.</text>
  </svg>