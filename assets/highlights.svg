<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="268" viewBox="0 0 1180 268" role="img" aria-label="Feature highlights: 40 MP photos, 4K video, zero uploads, potato mode"><rect width="1180" height="268" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1178" height="266" rx="23" fill="none" stroke="#2a1f45"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070510"/>
      <stop offset=".55" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f0abfc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="video" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloMint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c8aa5"/>
    </marker>

    <style><![CDATA[
      .rise   { animation: rise 3.4s ease-in-out infinite; }
      @keyframes rise   { 0%,100% { opacity:.62 } 50% { opacity:1 } }
      .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}
      .d4{animation-delay:1.2s}.d5{animation-delay:1.5s}.d6{animation-delay:1.8s}
      .d7{animation-delay:2.1s}.d8{animation-delay:2.4s}

      .dash   { stroke-dasharray:6 8; animation: dash 1.7s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-28 } }

      .tick   { stroke-dasharray:56; stroke-dashoffset:56;
                animation: tick 3.6s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes tick { 0%{stroke-dashoffset:56} 40%,74%{stroke-dashoffset:0}
                        100%{stroke-dashoffset:56} }
      .k1{animation-delay:.35s}.k2{animation-delay:.7s}.k3{animation-delay:1.05s}
      .k4{animation-delay:1.4s}.k5{animation-delay:1.75s}.k6{animation-delay:2.1s}

      .glow  { animation: glow 4s ease-in-out infinite; }
      @keyframes glow { 0%,100%{opacity:.26} 50%{opacity:.92} }

      .sweep { animation: sweep 5.2s cubic-bezier(.4,0,.6,1) infinite; }
      @keyframes sweep { 0%{transform:translateX(-200px)} 100%{transform:translateX(1300px)} }

      .drift { animation: drift 17s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(38px,-22px)} }

      .lift  { animation: lift 5.4s ease-in-out infinite; }
      @keyframes lift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

      .spin  { animation: spin 30s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .ring  { animation: ring 4.4s ease-in-out infinite; }
      @keyframes ring { 0%,100%{opacity:.32;transform:scale(1)}
                        50%{opacity:.8;transform:scale(1.06)} }

      .tw    { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.14} 50%{opacity:.92} }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }]]></style>
  </defs>
    <g class="lift d1">
      <rect x="40" y="24" width="259" height="220" rx="13" fill="#120c20" stroke="#2a1f45"/><path d="M53 25 H286 a12 12 0 0 1 12 12 V54 H41 V37 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
      <rect x="40" y="24" width="259" height="4" rx="2" fill="#a78bfa"/>
      <text x="64" y="106" font-family="" font-size="54"
            font-weight="800" fill="#f8fafc">40</text>
      <text x="128" y="106" font-family=""
            font-size="19" font-weight="700" fill="#a78bfa">MP max</text>
      <text x="64" y="142" font-family="" font-size="14.5"
            font-weight="700" fill="#f8fafc">Photo super-resolution</text>
      <text x="64" y="170" font-family=""
                   font-size="12.5" fill="#94a3b8">24 MP by default.</text><text x="64" y="190" font-family=""
                   font-size="12.5" fill="#94a3b8">Tiled GPU readback,</text><text x="64" y="210" font-family=""
                   font-size="12.5" fill="#94a3b8">portrait DNG upright.</text>
      <rect x="64" y="238" width="211" height="3" rx="1.5" fill="#a78bfa" opacity=".55"/>
    </g>
    <g class="lift d2">
      <rect x="320" y="24" width="259" height="220" rx="13" fill="#120c20" stroke="#2a1f45"/><path d="M333 25 H566 a12 12 0 0 1 12 12 V54 H321 V37 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
      <rect x="320" y="24" width="259" height="4" rx="2" fill="#34d399"/>
      <text x="344" y="106" font-family="" font-size="54"
            font-weight="800" fill="#f8fafc">4K</text>
      <text x="408" y="106" font-family=""
            font-size="19" font-weight="700" fill="#34d399">video</text>
      <text x="344" y="142" font-family="" font-size="14.5"
            font-weight="700" fill="#f8fafc">Two-pass rebuild</text>
      <text x="344" y="170" font-family=""
                   font-size="12.5" fill="#94a3b8">1080p becomes 3840×2160.</text><text x="344" y="190" font-family=""
                   font-size="12.5" fill="#94a3b8">Audio kept in sync,</text><text x="344" y="210" font-family=""
                   font-size="12.5" fill="#94a3b8">BT.709 colour.</text>
      <rect x="344" y="238" width="211" height="3" rx="1.5" fill="#34d399" opacity=".55"/>
    </g>
    <g class="lift d3">
      <rect x="600" y="24" width="259" height="220" rx="13" fill="#120c20" stroke="#2a1f45"/><path d="M613 25 H846 a12 12 0 0 1 12 12 V54 H601 V37 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
      <rect x="600" y="24" width="259" height="4" rx="2" fill="#f59e0b"/>
      <text x="624" y="106" font-family="" font-size="54"
            font-weight="800" fill="#f8fafc">0</text>
      <text x="656" y="106" font-family=""
            font-size="19" font-weight="700" fill="#f59e0b">uploads</text>
      <text x="624" y="142" font-family="" font-size="14.5"
            font-weight="700" fill="#f8fafc">Fully offline</text>
      <text x="624" y="170" font-family=""
                   font-size="12.5" fill="#94a3b8">No account, no cloud,</text><text x="624" y="190" font-family=""
                   font-size="12.5" fill="#94a3b8">no subscription.</text><text x="624" y="210" font-family=""
                   font-size="12.5" fill="#94a3b8">Your photos stay yours.</text>
      <rect x="624" y="238" width="211" height="3" rx="1.5" fill="#f59e0b" opacity=".55"/>
    </g>
    <g class="lift d4">
      <rect x="880" y="24" width="259" height="220" rx="13" fill="#120c20" stroke="#2a1f45"/><path d="M893 25 H1126 a12 12 0 0 1 12 12 V54 H881 V37 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
      <rect x="880" y="24" width="259" height="4" rx="2" fill="#f0abfc"/>
      <text x="904" y="106" font-family="" font-size="54"
            font-weight="800" fill="#f8fafc">1</text>
      <text x="936" y="106" font-family=""
            font-size="19" font-weight="700" fill="#f0abfc">switch</text>
      <text x="904" y="142" font-family="" font-size="14.5"
            font-weight="700" fill="#f8fafc">Potato mode</text>
      <text x="904" y="170" font-family=""
                   font-size="12.5" fill="#94a3b8">16 MP, 1080p30,</text><text x="904" y="190" font-family=""
                   font-size="12.5" fill="#94a3b8">lower bitrate. Fast on</text><text x="904" y="210" font-family=""
                   font-size="12.5" fill="#94a3b8">hot phones.</text>
      <rect x="904" y="238" width="211" height="3" rx="1.5" fill="#f0abfc" opacity=".55"/>
    </g></svg>