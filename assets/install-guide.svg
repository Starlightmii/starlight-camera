<svg xmlns="http://www.w3.org/2000/svg" width="880" height="856" viewBox="0 0 880 856" role="img" aria-label="Starlight Camera setup, phone only: download, install, configure, tune"><rect width="880" height="856" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="878" height="854" rx="23" fill="none" stroke="#2a1f45"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070510"/>
      <stop offset=".55" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f0abfc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="video" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloMint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c8aa5"/>
    </marker>

    <style><![CDATA[
      .rise   { animation: rise 3.4s ease-in-out infinite; }
      @keyframes rise   { 0%,100% { opacity:.62 } 50% { opacity:1 } }
      .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}
      .d4{animation-delay:1.2s}.d5{animation-delay:1.5s}.d6{animation-delay:1.8s}
      .d7{animation-delay:2.1s}.d8{animation-delay:2.4s}

      .dash   { stroke-dasharray:6 8; animation: dash 1.7s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-28 } }

      .tick   { stroke-dasharray:56; stroke-dashoffset:56;
                animation: tick 3.6s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes tick { 0%{stroke-dashoffset:56} 40%,74%{stroke-dashoffset:0}
                        100%{stroke-dashoffset:56} }
      .k1{animation-delay:.35s}.k2{animation-delay:.7s}.k3{animation-delay:1.05s}
      .k4{animation-delay:1.4s}.k5{animation-delay:1.75s}.k6{animation-delay:2.1s}

      .glow  { animation: glow 4s ease-in-out infinite; }
      @keyframes glow { 0%,100%{opacity:.26} 50%{opacity:.92} }

      .sweep { animation: sweep 5.2s cubic-bezier(.4,0,.6,1) infinite; }
      @keyframes sweep { 0%{transform:translateX(-200px)} 100%{transform:translateX(1300px)} }

      .drift { animation: drift 17s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(38px,-22px)} }

      .lift  { animation: lift 5.4s ease-in-out infinite; }
      @keyframes lift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

      .spin  { animation: spin 30s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .ring  { animation: ring 4.4s ease-in-out infinite; }
      @keyframes ring { 0%,100%{opacity:.32;transform:scale(1)}
                        50%{opacity:.8;transform:scale(1.06)} }

      .tw    { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.14} 50%{opacity:.92} }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }]]></style>
  </defs>
  <g filter="url(#soft)">
    <circle class="drift" cx="120" cy="140" r="110" fill="url(#halo)"/>
    <circle class="drift d4" cx="780" cy="720" r="110" fill="url(#haloMint)"/>
  </g>

  <text x="40" y="52" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#f8fafc">Setup, phone only</text>
  <text x="40" y="78" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a78bfa">No PC, no cable, no root. About three minutes.</text>

  
    <g class="rise d1">
      <rect x="40" y="96" width="256" height="68" rx="11" fill="#160f27" stroke="#2a1f45"/>
      <text x="56" y="124" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13.5" font-weight="800" fill="#a78bfa">132.4 MB</text>
      <text x="56" y="146" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13" fill="#e2e8f0">the camera app</text>
    </g>
    <g class="rise d2">
      <rect x="308" y="96" width="256" height="68" rx="11" fill="#160f27" stroke="#2a1f45"/>
      <text x="324" y="124" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13.5" font-weight="800" fill="#34d399">154 KB</text>
      <text x="324" y="146" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13" fill="#e2e8f0">the tuning config</text>
    </g>
    <g class="rise d3">
      <rect x="576" y="96" width="256" height="68" rx="11" fill="#160f27" stroke="#2a1f45"/>
      <text x="592" y="124" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13.5" font-weight="800" fill="#f59e0b">94.5 MB</text>
      <text x="592" y="146" font-family="Inter, 'Segoe UI', sans-serif"
            font-size="13" fill="#e2e8f0">optional library</text>
    </g>
  
    <g class="rise d1">
      <rect x="40" y="200" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="200" width="4" height="92" rx="2" fill="#a78bfa"/>
      <circle cx="70" cy="230" r="14" fill="#a78bfa" opacity=".18"/><text x="70" y="234.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#a78bfa">1</text>
      <text x="94" y="235" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Download the files</text>
      <text x="60" y="266" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Open Releases on the phone, tap each file.</text>
      <path class="tick k1" transform="translate(402 272) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#a78bfa" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d2">
      <rect x="456" y="200" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="456" y="200" width="4" height="92" rx="2" fill="#60a5fa"/>
      <circle cx="486" cy="230" r="14" fill="#60a5fa" opacity=".18"/><text x="486" y="234.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#60a5fa">2</text>
      <text x="510" y="235" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Remove the old camera</text>
      <text x="476" y="266" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Uninstall LMC / GCam first, same package name.</text>
      <path class="tick k2" transform="translate(818 272) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#60a5fa" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d3">
      <rect x="40" y="300" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="300" width="4" height="92" rx="2" fill="#a78bfa"/>
      <circle cx="70" cy="330" r="14" fill="#a78bfa" opacity=".18"/><text x="70" y="334.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#a78bfa">3</text>
      <text x="94" y="335" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Install the APK</text>
      <text x="60" y="366" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Tap it in Files, allow installs if asked.</text>
      <path class="tick k3" transform="translate(402 372) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#a78bfa" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d4">
      <rect x="456" y="300" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="456" y="300" width="4" height="92" rx="2" fill="#34d399"/>
      <circle cx="486" cy="330" r="14" fill="#34d399" opacity=".18"/><text x="486" y="334.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#34d399">4</text>
      <text x="510" y="335" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Move the helper files</text>
      <text x="476" y="366" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">XML into /sdcard/LMC8.4/, .so into its libs.</text>
      <path class="tick k4" transform="translate(818 372) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#34d399" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d5">
      <rect x="40" y="400" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="400" width="4" height="92" rx="2" fill="#22d3ee"/>
      <circle cx="70" cy="430" r="14" fill="#22d3ee" opacity=".18"/><text x="70" y="434.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#22d3ee">5</text>
      <text x="94" y="435" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Open it, allow permissions</text>
      <text x="60" y="466" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Camera, Photos, Microphone.</text>
      <path class="tick k5" transform="translate(402 472) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#22d3ee" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d6">
      <rect x="456" y="400" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="456" y="400" width="4" height="92" rx="2" fill="#f0abfc"/>
      <circle cx="486" cy="430" r="14" fill="#f0abfc" opacity=".18"/><text x="486" y="434.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f0abfc">6</text>
      <text x="510" y="435" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Load the config</text>
      <text x="476" y="466" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Double-tap beside the shutter, tap IMPORT.</text>
      <path class="tick k6" transform="translate(818 472) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#f0abfc" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d7">
      <rect x="40" y="500" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="500" width="4" height="92" rx="2" fill="#f59e0b"/>
      <circle cx="70" cy="530" r="14" fill="#f59e0b" opacity=".18"/><text x="70" y="534.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f59e0b">7</text>
      <text x="94" y="535" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Choose the library</text>
      <text x="60" y="566" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Settings, Photo processing, Library, per lens.</text>
      <path class="tick k1" transform="translate(402 572) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#f59e0b" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g class="rise d8">
      <rect x="456" y="500" width="404" height="92" rx="11" fill="#120c20" stroke="#2a1f45"/><rect x="456" y="500" width="4" height="92" rx="2" fill="#f472b6"/>
      <circle cx="486" cy="530" r="14" fill="#f472b6" opacity=".18"/><text x="486" y="534.86" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f472b6">8</text>
      <text x="510" y="535" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Switch the good stuff on</text>
      <text x="476" y="566" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Auto upscale, video upscale, potato mode.</text>
      <path class="tick k2" transform="translate(818 572) scale(0.85)" d="M0 0 l7 8 l15 -19" fill="none" stroke="#f472b6" stroke-width="3.76" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  <rect x="40" y="616" width="800" height="176" rx="13" fill="#160f27" stroke="#2a1f45"/><path d="M53 617 H827 a12 12 0 0 1 12 12 V646 H41 V629 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
  <text x="60" y="644" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#f472b6">If something goes wrong</text>
  <circle cx="64" cy="674" r="3.6" fill="#f472b6"/><text x="76" y="678" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fecaca">Will not install</text><text x="76" y="694" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">uninstall the old LMC / GCam</text><circle cx="468" cy="674" r="3.6" fill="#f472b6"/><text x="480" y="678" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fecaca">Config does not load</text><text x="480" y="694" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">XML must be in /sdcard/LMC8.4/</text><circle cx="64" cy="710" r="3.6" fill="#f472b6"/><text x="76" y="714" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fecaca">Upscale does nothing</text><text x="76" y="730" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">turn Auto upscale on</text><circle cx="468" cy="710" r="3.6" fill="#f472b6"/><text x="480" y="714" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fecaca">Video upscale fails</text><text x="480" y="730" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">keep 1.5× output size free</text><circle cx="64" cy="746" r="3.6" fill="#f472b6"/><text x="76" y="750" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fecaca">Preview tap is dead</text><text x="76" y="766" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">pick a media opener app</text><circle cx="468" cy="746" r="3.6" fill="#f472b6"/><text x="480" y="750" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fecaca">Crashes on launch</text><text x="480" y="766" font-family="Inter, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">Apps, Clear Data, reopen</text>
  </svg>