="tw d1" cx="960" cy="162" r="0.81" fill="#fff"/><circle class="tw d2" cx="855" cy="245" r="1.43" fill="#fff"/><circle class="tw d3" cx="59" cy="163" r="0.92" fill="#fff"/><circle class="tw d4" cx="728" cy="107" r="0.97" fill="#fff"/><circle class="tw d5" cx="1191" cy="284" r="1.15" fill="#fff"/><circle class="tw d6" cx="749" cy="203" r="1.03" fill="#fff"/><circle class="tw d7" cx="138" cy="341" r="1.7" fill="#fff"/><circle class="tw d8" cx="200" cy="191" r="0.82" fill="#fff"/><circle class="tw d1" cx="180" cy="35" r="0.91" fill="#fff"/><circle class="tw d2" cx="72" cy="40" r="1.06" fill="#fff"/><circle class="tw d3" cx="81" cy="132" r="2.02" fill="#fff"/><circle class="tw d4" cx="1084" cy="64" r="1.41" fill="#fff"/><circle class="tw d5" cx="929" cy="146" r="1.32" fill="#fff"/><circle class="tw d6" cx="299" cy="197" r="1.93" fill="#fff"/><circle class="tw d7" cx="230" cy="49" r="1.12" fill="#fff"/><circle class="tw d8" cx="343" cy="344" r="1.05" fill="#fff"/>

  <circle cx="224" cy="236" r="128" fill="url(#halo)" opacity=".55" filter="url(#soft)">
    <animate attributeName="r" values="118;142;118" dur="5.4s" repeatCount="indefinite"/>
