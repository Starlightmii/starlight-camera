 cy="85" r="0.71" fill="#fff"/><circle class="tw d2" cx="585" cy="126" r="1.23" fill="#fff"/><circle class="tw d3" cx="49" cy="85" r="0.8" fill="#fff"/><circle class="tw d4" cx="499" cy="57" r="0.85" fill="#fff"/><circle class="tw d5" cx="810" cy="146" r="1" fill="#fff"/><circle class="tw d6" cx="513" cy="105" r="0.89" fill="#fff"/><circle class="tw d7" cx="103" cy="174" r="1.46" fill="#fff"/><circle class="tw d8" cx="144" cy="99" r="0.71" fill="#fff"/>

