<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Starlight Camera vMax .51">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07050e"/>
      <stop offset=".5" stop-color="#120a22"/>
      <stop offset="1" stop-color="#05040a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f8fafc"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#10b981" stop-opacity=".38"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <style><![CDATA[
      .tw { animation: tw 3.4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
      .d1 { animation-delay:0s } .d2 { animation-delay:.5s } .d3 { animation-delay:1.1s }
      .d4 { animation-delay:1.7s } .d5 { animation-delay:2.3s } .d6 { animation-delay:2.9s }
      .floatA { animation: fl 7s ease-in-out infinite; }
      @keyframes fl { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-10px) } }
      .drift { animation: dr 16s ease-in-out infinite; }
      @keyframes dr { 0%,100% { transform:translate(0,0) } 50% { transform:translate(40px,-24px) } }
      .spin { animation: sp 26s linear infinite; transform-origin:210px 230px; }
      @keyframes sp { to { transform:rotate(360deg) } }
      .dash { stroke-dasharray:6 10; animation: dk 3s linear infinite; }
      @keyframes dk { to { stroke-dashoffset:-64 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    ]]></style>
  </defs>

  <rect width="1280" height="460" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="458" rx="29" fill="none" stroke="#2a1f45"/>

  <g filter="url(#soft)">
    <circle class="drift" cx="230" cy="230" r="150" fill="url(#auroraA)"/>
    <circle class="drift" cx="1080" cy="120" r="120" fill="url(#auroraB)"/>
  </g>

  <g fill="#ffffff">
    <circle class="tw d1" cx="150" cy="70" r="1.7"/>
    <circle class="tw d2" cx="320" cy="140" r="1.2"/>
    <circle class="tw d3" cx="520" cy="52" r="1.5"/>
    <circle class="tw d4" cx="760" cy="110" r="1.1"/>
    <circle class="tw d5" cx="980" cy="60" r="1.8"/>
    <circle class="tw d6" cx="1150" cy="150" r="1.3"/>
    <circle class="tw d2" cx="90" cy="330" r="1.3"/>
    <circle class="tw d4" cx="1200" cy="350" r="1.6"/>
    <circle class="tw d1" cx="640" cy="404" r="1.1"/>
    <circle class="tw d5" cx="430" cy="352" r="1.4"/>
    <circle class="tw d3" cx="880" cy="392" r="1.2"/>
  </g>

  <circle cx="210" cy="230" r="126" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="r" values="118;140;118" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(210 230)">
    <circle class="spin" r="92" fill="none" stroke="url(#ring)" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="300 90" opacity=".9"/>
    <circle r="68" fill="#0d0918" stroke="#2a1f45" stroke-width="2"/>
    <circle class="dash" r="46" fill="none" stroke="#f0abfc" stroke-width="3" opacity=".85"/>
    <circle r="26" fill="none" stroke="#34d399" stroke-width="2" opacity=".5">
      <animate attributeName="r" values="22;34;22" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M-19 5 L-6 21 L23 -17" fill="none" stroke="#34d399" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70"
          stroke-dashoffset="70">
      <animate attributeName="stroke-dashoffset" values="70;0;0;70" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g class="floatA">
    <text x="352" y="186" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="62" font-weight="800" fill="url(#title)">Starlight Camera</text>
    <text x="354" y="242" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="29" font-weight="500" fill="#c4b5fd">vMax .51 — on-device photo &amp; video super-resolution</text>
    <text x="354" y="294" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="22" fill="#94a3b8">Redmi Note 10 Pro Max · sweetin · Android APK · nothing leaves your phone</text>
  </g>

  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700">
    <g class="floatA" style="animation-delay:.4s">
      <rect x="354" y="326" width="158" height="44" rx="22" fill="#1b1230" stroke="#7c3aed"/>
      <text x="433" y="354" fill="#ddd6fe" text-anchor="middle">4K video ↑</text>
    </g>
    <g class="floatA" style="animation-delay:.9s">
      <rect x="524" y="326" width="164" height="44" rx="22" fill="#0f1f18" stroke="#34d399"/>
      <text x="606" y="354" fill="#a7f3d0" text-anchor="middle">40 MP photos</text>
    </g>
    <g class="floatA" style="animation-delay:1.4s">
      <rect x="700" y="326" width="156" height="44" rx="22" fill="#1f1208" stroke="#f59e0b"/>
      <text x="778" y="354" fill="#fde68a" text-anchor="middle">Potato mode</text>
    </g>
    <g class="floatA" style="animation-delay:1.9s">
      <rect x="868" y="326" width="176" height="44" rx="22" fill="#0b1220" stroke="#38bdf8"/>
      <text x="956" y="354" fill="#bae6fd" text-anchor="middle">100% offline</text>
    </g>
  </g>
</svg>