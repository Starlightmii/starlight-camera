<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="Starlight Camera processing pipeline">
  <defs>
    <linearGradient id="ph" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="vi" x1="0" x2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c8aa5"/>
    </marker>
    <style><![CDATA[
      .flow { stroke-dasharray:7 9; animation: fd 1.6s linear infinite; }
      @keyframes fd { to { stroke-dashoffset:-32 } }
      .node { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      .n2 { animation-delay:.4s } .n3 { animation-delay:.8s } .n4 { animation-delay:1.2s }
      .n5 { animation-delay:1.6s } .n6 { animation-delay:2s } .n7 { animation-delay:2.4s }
      .sweep { animation: sw 4.5s ease-in-out infinite; }
      @keyframes sw { 0% { transform:translateX(0) } 100% { transform:translateX(1000px) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    ]]></style>
  </defs>

  <rect width="1100" height="500" rx="24" fill="#0a0713"/>
  <rect x="1" y="1" width="1098" height="498" rx="23" fill="none" stroke="#241a3d"/>

  <text x="36" y="50" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#f8fafc">Processing pipeline</text>
  <text x="36" y="76" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#8b93a7">Every stage runs on the device. No network calls, ever.</text>

  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="36" y="112" font-size="15" font-weight="800" fill="#a78bfa">PHOTO</text>
    <g font-size="14" fill="#e2e8f0">
      <rect class="node"    x="36"  y="124" width="176" height="66" rx="13" fill="#171029" stroke="#4c3a7a"/>
      <text x="54" y="152" font-weight="700">GCam capture</text>
      <text x="54" y="174" fill="#8b93a7" font-size="12">JPEG / DNG / RAW</text>

      <rect class="node n2" x="246" y="124" width="184" height="66" rx="13" fill="#171029" stroke="#4c3a7a"/>
      <text x="264" y="152" font-weight="700">StarlightSR</text>
      <text x="264" y="174" fill="#8b93a7" font-size="12">1024px tiled GPU readback</text>

      <rect class="node n3" x="464" y="124" width="184" height="66" rx="13" fill="#171029" stroke="#4c3a7a"/>
      <text x="482" y="152" font-weight="700">Lanczos3 fallback</text>
      <text x="482" y="174" fill="#8b93a7" font-size="12">colour matrix + unsharp</text>

      <rect class="node n4" x="682" y="124" width="176" height="66" rx="13" fill="#0f1f18" stroke="#34d399"/>
      <text x="700" y="152" font-weight="700">24 / 40 MP</text>
      <text x="700" y="174" fill="#6ee7b7" font-size="12">JPEG q98 · EXIF upright</text>

      <rect class="node n5" x="892" y="124" width="172" height="66" rx="13" fill="#0f1f18" stroke="#34d399"/>
      <text x="910" y="152" font-weight="700">Gallery</text>
      <text x="910" y="174" fill="#6ee7b7" font-size="12">_Starlight named</text>
    </g>
    <g stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)">
      <path class="flow" d="M212 157 H242"/>
      <path class="flow" d="M430 157 H460"/>
      <path class="flow" d="M648 157 H678"/>
      <path class="flow" d="M858 157 H888"/>
    </g>

    <text x="36" y="242" font-size="15" font-weight="800" fill="#34d399">VIDEO</text>
    <g font-size="14" fill="#e2e8f0">
      <rect class="node n2" x="36"  y="254" width="166" height="66" rx="13" fill="#0d1a16" stroke="#2f6b56"/>
      <text x="54" y="282" font-weight="700">MediaCodec</text>
      <text x="54" y="304" fill="#8b93a7" font-size="12">hardware decode</text>

      <rect class="node n3" x="236" y="254" width="196" height="66" rx="13" fill="#0d1a16" stroke="#2f6b56"/>
      <text x="254" y="282" font-weight="700">Pass 1 — clean</text>
      <text x="254" y="304" fill="#8b93a7" font-size="12">chroma bilateral, BT.709</text>

      <rect class="node n4" x="466" y="254" width="196" height="66" rx="13" fill="#0d1a16" stroke="#2f6b56"/>
      <text x="484" y="282" font-weight="700">Pass 2 — detail</text>
      <text x="484" y="304" fill="#8b93a7" font-size="12">de-blur, dual-band, IGN</text>

      <rect class="node n5" x="696" y="254" width="164" height="66" rx="13" fill="#0f1f18" stroke="#34d399"/>
      <text x="714" y="282" font-weight="700">1:1 cadence</text>
      <text x="714" y="304" fill="#6ee7b7" font-size="12">no frame blending</text>

      <rect class="node n6" x="894" y="254" width="170" height="66" rx="13" fill="#0f1f18" stroke="#34d399"/>
      <text x="912" y="282" font-weight="700">4K output</text>
      <text x="912" y="304" fill="#6ee7b7" font-size="12">AAC audio kept</text>
    </g>
    <g stroke="#7c8aa5" stroke-width="2" fill="none" marker-end="url(#ar)">
      <path class="flow" d="M202 287 H232"/>
      <path class="flow" d="M432 287 H462"/>
      <path class="flow" d="M662 287 H692"/>
      <path class="flow" d="M860 287 H890"/>
    </g>

    <rect x="36" y="352" width="1028" height="120" rx="15" fill="#120c1f" stroke="#2a1f45"/>
    <text x="56" y="380" font-size="15" font-weight="800" fill="#f0abfc">Controls, safety and diagnostics</text>
    <g font-size="13.5" fill="#cbd5e1">
      <text x="56" y="408">🎛️ Denoise / Detail / Sharpen — full range, Off is truly zero</text>
      <text x="56" y="432">🥔 Potato mode — 16 MP, 1080p30, lower bitrate</text>
      <text x="56" y="456">📊 Rolling starlight.log + exit-reason dump</text>

      <text x="600" y="408">🧠 Capability probe picks a sustainable video tier</text>
      <text x="600" y="432">🌡️ Thermal and storage prechecks with pacing</text>
      <text x="600" y="456">🧵 Separate :sr process, so video never blocks the UI</text>
    </g>
  </g>
</svg>