<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-label="Animated diagram of the Starlight photo and video pipeline"><rect width="1180" height="560" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1178" height="558" rx="23" fill="none" stroke="#2a1f45"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070510"/>
      <stop offset=".55" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f0abfc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="video" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloMint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c8aa5"/>
    </marker>

    <style><![CDATA[
      .rise   { animation: rise 3.4s ease-in-out infinite; }
      @keyframes rise   { 0%,100% { opacity:.62 } 50% { opacity:1 } }
      .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}
      .d4{animation-delay:1.2s}.d5{animation-delay:1.5s}.d6{animation-delay:1.8s}
      .d7{animation-delay:2.1s}.d8{animation-delay:2.4s}

      .dash   { stroke-dasharray:6 8; animation: dash 1.7s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-28 } }

      .tick   { stroke-dasharray:56; stroke-dashoffset:56;
                animation: tick 3.6s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes tick { 0%{stroke-dashoffset:56} 40%,74%{stroke-dashoffset:0}
                        100%{stroke-dashoffset:56} }
      .k1{animation-delay:.35s}.k2{animation-delay:.7s}.k3{animation-delay:1.05s}
      .k4{animation-delay:1.4s}.k5{animation-delay:1.75s}.k6{animation-delay:2.1s}

      .glow  { animation: glow 4s ease-in-out infinite; }
      @keyframes glow { 0%,100%{opacity:.26} 50%{opacity:.92} }

      .sweep { animation: sweep 5.2s cubic-bezier(.4,0,.6,1) infinite; }
      @keyframes sweep { 0%{transform:translateX(-200px)} 100%{transform:translateX(1300px)} }

      .drift { animation: drift 17s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(38px,-22px)} }

      .lift  { animation: lift 5.4s ease-in-out infinite; }
      @keyframes lift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

      .spin  { animation: spin 30s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .ring  { animation: ring 4.4s ease-in-out infinite; }
      @keyframes ring { 0%,100%{opacity:.32;transform:scale(1)}
                        50%{opacity:.8;transform:scale(1.06)} }

      .tw    { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.14} 50%{opacity:.92} }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }]]></style>
  </defs>
  <g filter="url(#soft)">
    <circle class="drift" cx="180" cy="180" r="130" fill="url(#halo)"/>
    <circle class="drift d4" cx="1000" cy="420" r="130" fill="url(#haloMint)"/>
  </g>

  <text x="40" y="54" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#f8fafc">Photo &amp; video pipeline</text>
  <text x="40" y="80" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">Every stage runs on the phone. No network calls, ever.</text>
  <rect x="40" y="96" width="1100" height="3" rx="1.5" fill="#2a1f45"/><rect class="sweep" x="40" y="95" width="150" height="5" rx="2.5" fill="url(#rail)"/>

  <text x="40" y="122" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#a78bfa" letter-spacing="2">PHOTO</text>
  
    <g class="rise d1">
      <rect x="40" y="132" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="132" width="4" height="96" rx="2" fill="#a78bfa"/>
      <text x="58" y="160" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">GCam capture</text>
      <text x="58" y="182" font-family=""
                   font-size="11.5" fill="#94a3b8">JPEG · DNG · RAW</text>
    </g><path class="dash d1" d="M238 180 H250" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d2">
      <rect x="256" y="132" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="256" y="132" width="4" height="96" rx="2" fill="#a78bfa"/>
      <text x="274" y="160" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">StarlightSR</text>
      <text x="274" y="182" font-family=""
                   font-size="11.5" fill="#94a3b8">1024 px tiled GPU</text><text x="274" y="199" font-family=""
                   font-size="11.5" fill="#94a3b8">readback</text>
    </g><path class="dash d2" d="M454 180 H466" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d3">
      <rect x="472" y="132" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="472" y="132" width="4" height="96" rx="2" fill="#60a5fa"/>
      <text x="490" y="160" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">Lanczos3 fallback</text>
      <text x="490" y="182" font-family=""
                   font-size="11.5" fill="#94a3b8">colour matrix</text><text x="490" y="199" font-family=""
                   font-size="11.5" fill="#94a3b8">edge-gated sharpen</text>
    </g><path class="dash d3" d="M670 180 H682" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d4">
      <rect x="688" y="132" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="688" y="132" width="4" height="96" rx="2" fill="#34d399"/>
      <text x="706" y="160" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">24 / 40 MP</text>
      <text x="706" y="182" font-family=""
                   font-size="11.5" fill="#94a3b8">JPEG q98</text><text x="706" y="199" font-family=""
                   font-size="11.5" fill="#94a3b8">EXIF upright</text>
    </g><path class="dash d4" d="M886 180 H898" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d5">
      <rect x="904" y="132" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="904" y="132" width="4" height="96" rx="2" fill="#34d399"/>
      <text x="922" y="160" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">Gallery</text>
      <text x="922" y="182" font-family=""
                   font-size="11.5" fill="#94a3b8">named _Starlight</text>
    </g>

  <text x="40" y="286" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#34d399" letter-spacing="2">VIDEO</text>
  
    <g class="rise d2">
      <rect x="40" y="296" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="40" y="296" width="4" height="96" rx="2" fill="#34d399"/>
      <text x="58" y="324" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">MediaCodec</text>
      <text x="58" y="346" font-family=""
                   font-size="11.5" fill="#94a3b8">hardware decode</text>
    </g><path class="dash d1" d="M238 344 H250" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d3">
      <rect x="256" y="296" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="256" y="296" width="4" height="96" rx="2" fill="#34d399"/>
      <text x="274" y="324" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">Pass 1 · clean</text>
      <text x="274" y="346" font-family=""
                   font-size="11.5" fill="#94a3b8">chroma bilateral</text><text x="274" y="363" font-family=""
                   font-size="11.5" fill="#94a3b8">BT.709 luma</text>
    </g><path class="dash d2" d="M454 344 H466" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d4">
      <rect x="472" y="296" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="472" y="296" width="4" height="96" rx="2" fill="#22d3ee"/>
      <text x="490" y="324" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">Pass 2 · detail</text>
      <text x="490" y="346" font-family=""
                   font-size="11.5" fill="#94a3b8">de-blur · dual-band</text><text x="490" y="363" font-family=""
                   font-size="11.5" fill="#94a3b8">IGN dithering</text>
    </g><path class="dash d3" d="M670 344 H682" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d5">
      <rect x="688" y="296" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="688" y="296" width="4" height="96" rx="2" fill="#22d3ee"/>
      <text x="706" y="324" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">1:1 cadence</text>
      <text x="706" y="346" font-family=""
                   font-size="11.5" fill="#94a3b8">no frame blending</text>
    </g><path class="dash d4" d="M886 344 H898" stroke="#7c8aa5"
         stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <g class="rise d6">
      <rect x="904" y="296" width="196" height="96" rx="13" fill="#120c20" stroke="#2a1f45"/><rect x="904" y="296" width="4" height="96" rx="2" fill="#a3e635"/>
      <text x="922" y="324" font-family="" font-size="14"
            font-weight="700" fill="#f8fafc">4K output</text>
      <text x="922" y="346" font-family=""
                   font-size="11.5" fill="#94a3b8">AAC audio kept</text>
    </g>

  <rect x="40" y="424" width="1100" height="106" rx="13" fill="#160f27" stroke="#2a1f45"/><path d="M53 425 H1127 a12 12 0 0 1 12 12 V454 H41 V437 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
  <text x="62" y="452" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#f0abfc">Controls and safety</text>
  <circle cx="66" cy="476" r="4" fill="#60a5fa"/><text x="80" y="480" font-family="" font-size="12.5" font-weight="700" fill="#e2e8f0">Denoise · Detail · Sharpen</text><text x="80" y="495" font-family="" font-size="11" fill="#6b7280">full range — Off is truly zero</text><circle cx="432" cy="476" r="4" fill="#34d399"/><text x="446" y="480" font-family="" font-size="12.5" font-weight="700" fill="#e2e8f0">Capability probe</text><text x="446" y="495" font-family="" font-size="11" fill="#6b7280">picks a sustainable video tier</text><circle cx="798" cy="476" r="4" fill="#f59e0b"/><text x="812" y="480" font-family="" font-size="12.5" font-weight="700" fill="#e2e8f0">Potato mode</text><text x="812" y="495" font-family="" font-size="11" fill="#6b7280">16 MP · 1080p30 · lower bitrate</text><circle cx="66" cy="510" r="4" fill="#22d3ee"/><text x="80" y="514" font-family="" font-size="12.5" font-weight="700" fill="#e2e8f0">Thermal + storage prechecks</text><text x="80" y="529" font-family="" font-size="11" fill="#6b7280">with pacing, so long clips are safe</text><circle cx="432" cy="510" r="4" fill="#a78bfa"/><text x="446" y="514" font-family="" font-size="12.5" font-weight="700" fill="#e2e8f0">Separate :sr process</text><text x="446" y="529" font-family="" font-size="11" fill="#6b7280">video work never blocks the UI</text><circle cx="798" cy="510" r="4" fill="#f472b6"/><text x="812" y="514" font-family="" font-size="12.5" font-weight="700" fill="#e2e8f0">Rolling starlight.log</text><text x="812" y="529" font-family="" font-size="11" fill="#6b7280">plus an exit-reason dump</text>
  </svg>