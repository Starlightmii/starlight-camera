<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" role="img" aria-label="Which settings to change and what the three sliders do"><rect width="1180" height="340" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1178" height="338" rx="23" fill="none" stroke="#2a1f45"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070510"/>
      <stop offset=".55" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>

    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f0abfc" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="video" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloMint" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7c8aa5"/>
    </marker>

    <style><![CDATA[
      .rise   { animation: rise 3.4s ease-in-out infinite; }
      @keyframes rise   { 0%,100% { opacity:.62 } 50% { opacity:1 } }
      .d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}
      .d4{animation-delay:1.2s}.d5{animation-delay:1.5s}.d6{animation-delay:1.8s}
      .d7{animation-delay:2.1s}.d8{animation-delay:2.4s}

      .dash   { stroke-dasharray:6 8; animation: dash 1.7s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-28 } }

      .tick   { stroke-dasharray:56; stroke-dashoffset:56;
                animation: tick 3.6s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes tick { 0%{stroke-dashoffset:56} 40%,74%{stroke-dashoffset:0}
                        100%{stroke-dashoffset:56} }
      .k1{animation-delay:.35s}.k2{animation-delay:.7s}.k3{animation-delay:1.05s}
      .k4{animation-delay:1.4s}.k5{animation-delay:1.75s}.k6{animation-delay:2.1s}

      .glow  { animation: glow 4s ease-in-out infinite; }
      @keyframes glow { 0%,100%{opacity:.26} 50%{opacity:.92} }

      .sweep { animation: sweep 5.2s cubic-bezier(.4,0,.6,1) infinite; }
      @keyframes sweep { 0%{transform:translateX(-200px)} 100%{transform:translateX(1300px)} }

      .drift { animation: drift 17s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(38px,-22px)} }

      .lift  { animation: lift 5.4s ease-in-out infinite; }
      @keyframes lift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

      .spin  { animation: spin 30s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }

      .ring  { animation: ring 4.4s ease-in-out infinite; }
      @keyframes ring { 0%,100%{opacity:.32;transform:scale(1)}
                        50%{opacity:.8;transform:scale(1.06)} }

      .tw    { animation: tw 3.6s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.14} 50%{opacity:.92} }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }]]></style>
  </defs>
  <g filter="url(#soft)">
    <circle class="drift" cx="200" cy="170" r="120" fill="url(#halo)"/>
    <circle class="drift d3" cx="1000" cy="200" r="120" fill="url(#haloMint)"/>
  </g>

  <rect x="40" y="24" width="500" height="292" rx="13" fill="#120c20" stroke="#2a1f45"/><path d="M53 25 H527 a12 12 0 0 1 12 12 V54 H41 V37 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
  <text x="64" y="56" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#a78bfa">Settings worth touching</text>
  <text x="72" y="96" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e2e8f0">Auto upscale</text>
         <rect x="368" y="82" width="38.8" height="20" rx="10" fill="#a78bfa" opacity=".85"/>
         <text x="448" y="96" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">ON</text><text x="72" y="142" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e2e8f0">Video upscale</text>
         <rect x="368" y="128" width="90.60000000000001" height="20" rx="10" fill="#f0abfc" opacity=".85"/>
         <text x="448" y="142" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f0abfc">ON for 4K</text><text x="72" y="188" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e2e8f0">Potato mode</text>
         <rect x="368" y="174" width="112.80000000000001" height="20" rx="10" fill="#f59e0b" opacity=".85"/>
         <text x="448" y="188" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">only if slow</text><text x="72" y="234" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#e2e8f0">Media opener</text>
         <rect x="368" y="220" width="112.80000000000001" height="20" rx="10" fill="#f472b6" opacity=".85"/>
         <text x="448" y="234" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f472b6">your gallery</text>
  <text x="72" y="294" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Everything else can stay on Default.</text>

  <rect x="564" y="24" width="576" height="292" rx="13" fill="#0c1a17" stroke="#2f6b56"/><path d="M577 25 H1127 a12 12 0 0 1 12 12 V54 H565 V37 a12 12 0 0 1 12 -12 Z" fill="#ffffff" opacity=".022"/>
  <text x="588" y="56" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#34d399">The three sliders</text>
  <text x="588" y="76" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280">Off on all three is a genuine bypass.</text>
  
      <g class="rise d1">
        <text x="588" y="112" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Denoise</text>
        <text x="904" y="112" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">temporal + chroma</text>
        <rect x="588" y="124" width="300" height="9" rx="4.5" fill="#221a3a"/>
        <rect x="588" y="124" width="44" height="9" rx="4.5" fill="#60a5fa"/>
        <circle cx="632" cy="128.5" r="8.5" fill="#0b0716" stroke="#60a5fa" stroke-width="3"
                class="ring"/>
        <text x="588" y="154" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">Cleaner but softer. Low by day, higher at night.</text>
      </g>
      <g class="rise d2">
        <text x="588" y="180" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Detail</text>
        <text x="904" y="180" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">dual-band separation</text>
        <rect x="588" y="192" width="300" height="9" rx="4.5" fill="#221a3a"/>
        <rect x="588" y="192" width="62" height="9" rx="4.5" fill="#34d399"/>
        <circle cx="650" cy="196.5" r="8.5" fill="#0b0716" stroke="#34d399" stroke-width="3"
                class="ring"/>
        <text x="588" y="222" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">Micro-contrast and texture. Medium is a safe default.</text>
      </g>
      <g class="rise d3">
        <text x="588" y="248" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Sharpen</text>
        <text x="904" y="248" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280">directional de-blur</text>
        <rect x="588" y="260" width="300" height="9" rx="4.5" fill="#221a3a"/>
        <rect x="588" y="260" width="34" height="9" rx="4.5" fill="#f472b6"/>
        <circle cx="622" cy="264.5" r="8.5" fill="#0b0716" stroke="#f472b6" stroke-width="3"
                class="ring"/>
        <text x="588" y="290" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">Edge definition. Low for faces, higher for text.</text>
      </g>
  </svg>