<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="512" viewBox="0 0 1080 512"
     role="img" aria-label="Configuration guide: settings to change and what the three sliders do">
  <defs>
    <linearGradient id="sh2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a7f3d0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .trail { stroke-dasharray:7 9; animation: trail 1.5s linear infinite; }
      @keyframes trail { to { stroke-dashoffset:-32 } }
      .step  { animation: breathe 3s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity:.6 } 50% { opacity:1 } }
      .s2 { animation-delay:.35s } .s3 { animation-delay:.7s }
      .s4 { animation-delay:1.05s } .s5 { animation-delay:1.4s }
      .pop  { animation: pop 2.6s ease-in-out infinite; }
      @keyframes pop { 0%,100% { transform:scale(1) } 50% { transform:scale(1.06) } }
      .p2 { animation-delay:.4s } .p3 { animation-delay:.8s } .p4 { animation-delay:1.2s }
      .sweep { animation: sweep 4.6s ease-in-out infinite; }
      @keyframes sweep { 0% { transform:translateX(0); opacity:0 }
                         12% { opacity:1 } 88% { opacity:1 } 100% { transform:translateX(940px); opacity:0 } }
      .tick { stroke-dasharray:48; stroke-dashoffset:48; animation: tick 3s ease-in-out infinite; }
      @keyframes tick { 0% { stroke-dashoffset:48 } 45%,75% { stroke-dashoffset:0 } 100% { stroke-dashoffset:48 } }
      .k2 { animation-delay:.5s } .k3 { animation-delay:1s } .k4 { animation-delay:1.5s }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }]]></style>
  </defs>

  <rect width="1080" height="512" rx="22" fill="#0a0713"/>
  <rect x="1" y="1" width="1078" height="510" rx="21" fill="none" stroke="#241a3d"/>

  <text x="40" y="46" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Configure it properly</text>
  <text x="40" y="72" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8b93a7">Five settings worth touching, and what each slider actually changes.</text>

  <rect x="40" y="104" width="436" height="356" rx="16" fill="#120c1f" stroke="#2a1f45"/>
  <text x="56" y="136" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#a78bfa">Settings to change</text>
  
    <g class="step s1">
      <text x="56" y="168" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">Photo quality</text>
      <text x="436" y="168" text-anchor="end" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13"
            font-weight="700" fill="#a78bfa">Max</text>
      <rect x="56" y="178" width="380" height="8" rx="4" fill="#241b3d"/>
      <rect x="56" y="178" width="210" height="8" rx="4" fill="#a78bfa">
        <animate attributeName="width" values="0;210" dur="2.8s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>
    <g class="step s2">
      <text x="56" y="230" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">Upscale scale</text>
      <text x="436" y="230" text-anchor="end" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13"
            font-weight="700" fill="#22d3ee">2×</text>
      <rect x="56" y="240" width="380" height="8" rx="4" fill="#241b3d"/>
      <rect x="56" y="240" width="150" height="8" rx="4" fill="#22d3ee">
        <animate attributeName="width" values="0;150" dur="2.8s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>
    <g class="step s3">
      <text x="56" y="292" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">Smart naming</text>
      <text x="436" y="292" text-anchor="end" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13"
            font-weight="700" fill="#34d399">On</text>
      <rect x="56" y="302" width="380" height="8" rx="4" fill="#241b3d"/>
      <rect x="56" y="302" width="260" height="8" rx="4" fill="#34d399">
        <animate attributeName="width" values="0;260" dur="2.8s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>
    <g class="step s4">
      <text x="56" y="354" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">Video upscale</text>
      <text x="436" y="354" text-anchor="end" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13"
            font-weight="700" fill="#f0abfc">On</text>
      <rect x="56" y="364" width="380" height="8" rx="4" fill="#241b3d"/>
      <rect x="56" y="364" width="260" height="8" rx="4" fill="#f0abfc">
        <animate attributeName="width" values="0;260" dur="2.8s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>
    <g class="step s5">
      <text x="56" y="416" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#e2e8f0">Potato mode</text>
      <text x="436" y="416" text-anchor="end" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13"
            font-weight="700" fill="#f59e0b">Off</text>
      <rect x="56" y="426" width="380" height="8" rx="4" fill="#241b3d"/>
      <rect x="56" y="426" width="70" height="8" rx="4" fill="#f59e0b">
        <animate attributeName="width" values="0;70" dur="2.8s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>

  <rect x="512" y="104" width="528" height="356" rx="16" fill="#0d1a16" stroke="#2f6b56"/>
  <text x="536" y="136" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#34d399">The three sliders</text>
  <text x="536" y="158" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b93a7">Off is a genuine bypass on all three.</text>
  
    <g class="step s1">
      <text x="536" y="182" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Denoise</text>
      <rect x="536" y="194" width="300" height="10" rx="5" fill="#241b3d"/>
      <rect x="536" y="194" width="130" height="10" rx="5" fill="#60a5fa">
        <animate attributeName="width" values="0;130" dur="2.6s" begin="0.3s" fill="freeze"/>
      </rect>
      <circle class="pop p1" cx="666" cy="199" r="9" fill="#0a0713" stroke="#60a5fa" stroke-width="3"/>
      <text x="536" y="232" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b93a7">Low by day, higher at night</text>
    </g>
    <g class="step s2">
      <text x="536" y="258" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Detail</text>
      <rect x="536" y="270" width="300" height="10" rx="5" fill="#241b3d"/>
      <rect x="536" y="270" width="168" height="10" rx="5" fill="#34d399">
        <animate attributeName="width" values="0;168" dur="2.6s" begin="0.3s" fill="freeze"/>
      </rect>
      <circle class="pop p2" cx="704" cy="275" r="9" fill="#0a0713" stroke="#34d399" stroke-width="3"/>
      <text x="536" y="308" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b93a7">Medium is a safe default</text>
    </g>
    <g class="step s3">
      <text x="536" y="334" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Sharpen</text>
      <rect x="536" y="346" width="300" height="10" rx="5" fill="#241b3d"/>
      <rect x="536" y="346" width="100" height="10" rx="5" fill="#f472b6">
        <animate attributeName="width" values="0;100" dur="2.6s" begin="0.3s" fill="freeze"/>
      </rect>
      <circle class="pop p3" cx="636" cy="351" r="9" fill="#0a0713" stroke="#f472b6" stroke-width="3"/>
      <text x="536" y="384" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b93a7">Low for faces, high for text</text>
    </g>

  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#8b93a7">
    <text x="40" y="492">💡 40 MP and 4K are heavy jobs on a 732G — use Potato mode when you want the shot fast, Max when you want the print.</text>
  </g>
</svg>