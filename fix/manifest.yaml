fix_id: starlight-camera-vmax
name: "Starlight Camera vMax — Gemini two-pass video, slider range, branding"
rom: coloros
component: camera
severity: feature
status: device-tested
registration_status: staged
version: "vMax (versionCode 64764922)"
date: "2026-11-12"
updated: "2026-11-13"

purpose: >-
  Experimental maximum-quality successor to starlight-camera-upscale. Keeps the
  v2.0 Tensei-parity default pipeline and adds a selectable max photo path
  (GPU tile readback + Lanczos3 fallback, exact Tensei colour matrix,
  edge-gated unsharp, JPEG q98, 40 MP cap), a hardware video super-resolution
  path (H.264 4K + re-encoded AAC clipped to the video), potato mode,
  capability-probed video tiers, thermal pacing, a foreground service, a
  separate `:sr` video process, an animated rainbow progress bar, a ColorOS
  live-alert progress notification, and a fixed preview opener.

background:
  v2_baseline: >-
    v2.0 is user-confirmed working; its default photo path is the Tensei
    pipeline (Canvas/RenderScript bicubic, saturation/contrast 1.15, cross
    kernel [0,-1,0,-1,5,-1,0,-1,0], 24 MP cap, JPEG q98). vMax leaves that path
    intact as the "default" photo-quality option.
  tensei_finding: >-
    Tensei is not an AI upscaler. It has no model assets and no TFLite/ONNX/
    NCNN/MNN runtime. See agents/results/lmc84-upscale-v2/TENSEI_ANALYSIS.md.
  limitations: >-
    No real ML super-resolution model, NDK/Vulkan path, or 4:4:4 JPEG encoder is
    present. Skia JPEG q98 remains 4:2:0. Video uses hardware MediaCodec
    decode/encode with a two-pass GPU OES pipeline (temporal/chroma clean then
    directional de-blur/dual-band/IGN). HDR/10-bit is skipped. Media3 migration
    is not implemented because the APK has no androidx.media3 dependency.

